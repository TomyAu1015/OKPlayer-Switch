name: Build Switch NSP & NRO (OKPlayer-Switch)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack RomFS Assets & Compile NRO + NSP
        run: |
          if [ -f romfs_assets.zip ]; then
            unzip -q -o romfs_assets.zip -d .
          fi
          export PKG_CONFIG_PATH=/opt/devkitpro/portlibs/switch/lib/pkgconfig
          FFMPEG_LIBS=$(pkg-config --libs libavformat libavcodec libswscale libswresample libavutil 2>/dev/null || echo "-lavformat -lavcodec -lswscale -lswresample -lavutil -ldav1d")
          sed -i "s|-lavformat -lavcodec -lswscale -lswresample -lavutil|${FFMPEG_LIBS} -ldav1d|g" Makefile
          sed -i 's/ -lzstd/ -lbz2/g' Makefile
          sed -i 's|-f \$(CURDIR)/Makefile$|-f $(CURDIR)/Makefile all|' Makefile
          make clean
          make -j$(nproc)
          mkdir -p release_bundle/switch/OKPlayer-Switch
          cp OKPlayer-Switch.nro release_bundle/switch/OKPlayer-Switch/OKPlayer-Switch.nro
          cp dist/OKPlayer_Switch_01058800A9E20000.nsp release_bundle/OKPlayer_Switch_01058800A9E20000.nsp

      - name: Upload Switch NSP + NRO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OKPlayer-Switch-NSP-and-NRO
          path: |
            OKPlayer-Switch.nro
            dist/OKPlayer_Switch_01058800A9E20000.nsp
            release_bundle/**
          if-no-files-found: error
